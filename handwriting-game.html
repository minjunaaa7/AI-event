<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>손글씨 인식 피하기</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <h1>손글씨 인식 피하기 게임</h1>
  <p class="subtitle">AI가 내 글씨를 알아보지 못하게 써보세요.</p>

  <div class="card" id="waitCard">
    <p class="status-line">관리자의 시작을 기다리는 중...</p>
  </div>

  <div class="card" id="countdownCard" style="display:none;">
    <div class="countdown" id="countdownNum">3</div>
    <p class="status-line" style="text-align:center;">곧 제시어가 공개됩니다</p>
  </div>

  <div class="card" id="writingCard" style="display:none;">
    <h2>제시어</h2>
    <div class="big-number" id="wordView">-</div>
    <p class="status-line" style="text-align:center;">남은 시간: <span id="writeTimer">-</span>초</p>
  </div>

  <div class="card" id="captureCard" style="display:none;">
    <h2>카메라에 인식해주세요</h2>
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" style="display:none;"></canvas>
    <div style="margin-top:14px;">
      <button class="full" id="captureBtn">촬영하기</button>
    </div>
  </div>

  <div class="card" id="resultCard" style="display:none;">
    <h2>판별 결과</h2>
    <p id="resultText" class="status-line"></p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/db-helper.js"></script>
<script>
const teamId = getTeamId();
let currentPhase = "idle";
let writingInterval = null;
let stream = null;

function scoreFromConfidence(pct) {
  if (pct <= 10) return 30;
  if (pct <= 20) return 25;
  if (pct <= 30) return 20;
  if (pct <= 40) return 18;
  if (pct <= 50) return 16;
  if (pct <= 60) return 14;
  if (pct <= 70) return 11;
  if (pct <= 80) return 8;
  if (pct <= 90) return 5;
  return 2;
}

// 간단한 편집거리 기반 유사도 (0~1)
function similarity(a, b) {
  a = (a || "").replace(/\s/g, "");
  b = (b || "").replace(/\s/g, "");
  if (!a || !b) return 0;
  const dp = Array(a.length + 1).fill(null).map(() => Array(b.length + 1).fill(0));
  for (let i = 0; i <= a.length; i++) dp[i][0] = i;
  for (let j = 0; j <= b.length; j++) dp[0][j] = j;
  for (let i = 1; i <= a.length; i++) {
    for (let j = 1; j <= b.length; j++) {
      dp[i][j] = a[i-1] === b[j-1]
        ? dp[i-1][j-1]
        : 1 + Math.min(dp[i-1][j-1], dp[i-1][j], dp[i][j-1]);
    }
  }
  const dist = dp[a.length][b.length];
  return Math.max(0, 1 - dist / Math.max(a.length, b.length));
}

function showCard(id) {
  ["waitCard","countdownCard","writingCard","captureCard","resultCard"].forEach(c => {
    document.getElementById(c).style.display = (c === id) ? "block" : "none";
  });
}

async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    document.getElementById("video").srcObject = stream;
  } catch (e) {
    alert("카메라를 사용할 수 없습니다: " + e.message);
  }
}

document.getElementById("captureBtn").onclick = async () => {
  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext("2d").drawImage(video, 0, 0);
  const base64 = canvas.toDataURL("image/jpeg", 0.85).split(",")[1];

  showCard("resultCard");
  document.getElementById("resultText").textContent = "인식완료, 확인중...";

  if (stream) stream.getTracks().forEach(t => t.stop());

  try {
    const resp = await fetch("/api/vision", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ base64: base64, feature: "DOCUMENT_TEXT_DETECTION" })
    });
    const data = await resp.json();
    const annotation = data.responses[0].fullTextAnnotation;
    const recognizedText = annotation ? annotation.text.trim() : "(인식 안 됨)";

    // 세션의 원래 제시어와 비교
    const sessSnap = await db.ref("sessions/handwriting/word").get();
    const targetWord = sessSnap.val() || "";
    const biasSnap = await db.ref("sessions/handwritingBias").get();
    const bias = biasSnap.val() || 0;

    const sim = similarity(recognizedText, targetWord); // 0~1
    let pct = Math.round(sim * 100) + bias;
    pct = Math.max(0, Math.min(100, pct));
    const points = scoreFromConfidence(pct);

    await addScore(teamId, points);

    document.getElementById("resultText").innerHTML =
      `판별결과: ${recognizedText || "NULL"}<br>확신: ${pct}%<br>점수: ${points}점`;
  } catch (e) {
    document.getElementById("resultText").textContent = "인식 중 오류가 발생했습니다: " + e.message;
  }
};

watchPath("sessions/handwriting", (s) => {
  if (!s || s.phase === "idle" || !s.phase) {
    currentPhase = "idle";
    clearInterval(writingInterval);
    showCard("waitCard");
    return;
  }

  if (s.phase === "countdown" && currentPhase !== "countdown") {
    currentPhase = "countdown";
    showCard("countdownCard");
    const tick = () => {
      const elapsed = Math.floor((Date.now() - s.countdownStartedAt) / 1000);
      const remain = 3 - elapsed;
      document.getElementById("countdownNum").textContent = remain > 0 ? remain : "시작!";
    };
    tick();
    clearInterval(writingInterval);
    writingInterval = setInterval(tick, 200);
  }

  if (s.phase === "writing" && currentPhase !== "writing") {
    currentPhase = "writing";
    clearInterval(writingInterval);
    showCard("writingCard");
    document.getElementById("wordView").textContent = s.word;

    const tick = () => {
      const elapsed = Math.floor((Date.now() - s.startedAt) / 1000);
      const remain = s.writeSeconds - elapsed;
      if (remain <= 0) {
        clearInterval(writingInterval);
        showCard("captureCard");
        startCamera();
      } else {
        document.getElementById("writeTimer").textContent = remain;
      }
    };
    tick();
    writingInterval = setInterval(tick, 500);
  }
});
</script>
</body>
</html>
