<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>퍼스널컬러 진단</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <h1>퍼스널컬러 진단</h1>
  <p class="subtitle">정면을 바라보고, 안경을 벗은 상태로 촬영하면 더 정확합니다. 그늘지지 않은 밝은 곳에서 촬영하세요.</p>
  <p class="subtitle" style="margin-top:-20px;">더 정확한 진단을 원하면, 머리 뒤 위쪽 양쪽 점선 박스 안에 흰 종이가 보이도록 대주세요. (없어도 진단은 가능합니다)</p>

  <div class="card" id="captureCard">
    <div style="position:relative;">
      <video id="video" autoplay playsinline></video>
      <div style="position:absolute; top:4%; left:4%; width:18%; height:18%; border:2px dashed #fff; box-shadow:0 0 0 1px rgba(0,0,0,.4); border-radius:4px; pointer-events:none;"></div>
      <div style="position:absolute; top:4%; right:4%; width:18%; height:18%; border:2px dashed #fff; box-shadow:0 0 0 1px rgba(0,0,0,.4); border-radius:4px; pointer-events:none;"></div>
    </div>
    <canvas id="canvas" style="display:none;"></canvas>
    <div style="margin-top:14px;">
      <button class="full" id="captureBtn">촬영하기</button>
    </div>
  </div>

  <div class="card" id="loadingCard" style="display:none;">
    <p class="status-line">분석 중입니다...</p>
  </div>

  <div class="card" id="retryCard" style="display:none;">
    <p class="status-line" id="retryReason"></p>
    <button class="full" id="retryFromErrorBtn">다시 촬영하기</button>
  </div>

  <div class="card" id="resultCard" style="display:none;">
    <h2 id="resultTitle">-</h2>
    <p id="resultDesc" class="status-line"></p>
    <div id="palette" style="margin-top:14px;"></div>
    <button class="secondary full" style="margin-top:16px;" id="retryBtn">다시 진단하기</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/db-helper.js"></script>
<script>
const teamId = getTeamId();
let stream = null;

const TYPES = {
  springWarm: {
    title: "봄 웜톤",
    desc: "밝고 화사한 웜톤입니다. 코랄, 피치, 아이보리 계열이 잘 어울립니다.",
    colors: ["#FF8C69", "#FFD59E", "#FFF3C4", "#B7D98A"]
  },
  autumnWarm: {
    title: "가을 웜톤",
    desc: "차분하고 깊은 웜톤입니다. 카키, 브라운, 머스타드 계열이 잘 어울립니다.",
    colors: ["#A9702B", "#C97F3C", "#7A5C3E", "#B79A5C"]
  },
  summerCool: {
    title: "여름 쿨톤",
    desc: "밝고 부드러운 쿨톤입니다. 라벤더, 로즈, 소프트 그레이 계열이 잘 어울립니다.",
    colors: ["#C9A6D9", "#F2A6C0", "#9FB8D9", "#D9D9D9"]
  },
  winterCool: {
    title: "겨울 쿨톤",
    desc: "선명하고 대비가 강한 쿨톤입니다. 블랙, 화이트, 핫핑크 계열이 잘 어울립니다.",
    colors: ["#1C1C1E", "#E6007A", "#0B4F8A", "#FFFFFF"]
  }
};

async function startCamera() {
  stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
  document.getElementById("video").srcObject = stream;
}
startCamera();
db.ref("teams/" + teamId + "/personalColorStatus").set("대기중");

function showOnly(id) {
  ["captureCard", "loadingCard", "retryCard", "resultCard"].forEach(c =>
    document.getElementById(c).style.display = (c === id) ? "block" : "none");
}

function rgbToLab(r, g, b) {
  let [rl, gl, bl] = [r, g, b].map(v => {
    v /= 255;
    return v > 0.04045 ? Math.pow((v + 0.055) / 1.055, 2.4) : v / 12.92;
  });
  const x = (rl * 0.4124 + gl * 0.3576 + bl * 0.1805) / 0.95047;
  const y = (rl * 0.2126 + gl * 0.7152 + bl * 0.0722) / 1.0;
  const z = (rl * 0.0193 + gl * 0.1192 + bl * 0.9505) / 1.08883;
  const f = t => t > 0.008856 ? Math.cbrt(t) : (7.787 * t + 16 / 116);
  const fx = f(x), fy = f(y), fz = f(z);
  return { L: 116 * fy - 16, a: 500 * (fx - fy), b: 200 * (fy - fz) };
}

function classify(skinLab, depthScore) {
  const warm = skinLab.b > 12;
  const light = depthScore > 60;
  if (warm && light) return "springWarm";
  if (warm && !light) return "autumnWarm";
  if (!warm && light) return "summerCool";
  return "winterCool";
}

// ---- 지정한 박스 영역을 그림자/하이라이트 제외하고 중앙값으로 샘플링 ----
function sampleBox(imgData, width, height, x0, y0, x1, y1, excludeExtremes) {
  const rs = [], gs = [], bs = [];
  x0 = Math.max(0, Math.round(x0)); x1 = Math.min(width - 1, Math.round(x1));
  y0 = Math.max(0, Math.round(y0)); y1 = Math.min(height - 1, Math.round(y1));
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      const idx = (y * width + x) * 4;
      const r = imgData[idx], g = imgData[idx + 1], b = imgData[idx + 2];
      const lum = 0.299 * r + 0.587 * g + 0.114 * b;
      if (excludeExtremes && (lum < 25 || lum > 248)) continue; // 그림자 / 완전 클리핑 제외
      rs.push(r); gs.push(g); bs.push(b);
    }
  }
  if (rs.length === 0) return null;
  const median = arr => { const s = [...arr].sort((a, b) => a - b); return s[Math.floor(s.length / 2)]; };
  return { r: median(rs), g: median(gs), b: median(bs) };
}

function samplePatch(imgData, width, height, cx, cy, radius) {
  return sampleBox(imgData, width, height, cx - radius, cy - radius, cx + radius, cy + radius, true);
}

// 흰 종이 가이드 박스(화면 좌우 상단, 4%~22% 위치) 색상 샘플.
// 무채색이고 충분히 밝아야 "종이가 실제로 보인다"고 판단. 아니면 null 반환.
function samplePaperReference(imgData, width, height) {
  const boxes = [
    [width * 0.04, height * 0.04, width * 0.22, height * 0.22],
    [width * 0.78, height * 0.04, width * 0.96, height * 0.22]
  ];
  const samples = boxes
    .map(([x0, y0, x1, y1]) => sampleBox(imgData, width, height, x0, y0, x1, y1, false))
    .filter(Boolean)
    .filter(c => {
      const lum = 0.299 * c.r + 0.587 * c.g + 0.114 * c.b;
      const spread = Math.max(c.r, c.g, c.b) - Math.min(c.r, c.g, c.b);
      return lum > 140 && spread < 35; // 밝고 무채색이어야 종이로 인정
    });
  return averageColors(samples);
}

function averageColors(colors) {
  const valid = colors.filter(Boolean);
  if (valid.length === 0) return null;
  const sum = valid.reduce((acc, c) => ({ r: acc.r + c.r, g: acc.g + c.g, b: acc.b + c.b }), { r: 0, g: 0, b: 0 });
  return { r: sum.r / valid.length, g: sum.g / valid.length, b: sum.b / valid.length };
}

function findLandmark(landmarks, type) {
  const lm = (landmarks || []).find(l => l.type === type);
  return lm ? lm.position : null;
}

document.getElementById("captureBtn").onclick = async () => {
  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext("2d");
  ctx.drawImage(video, 0, 0);
  const base64 = canvas.toDataURL("image/jpeg", 0.92).split(",")[1];

  showOnly("loadingCard");
  db.ref("teams/" + teamId + "/personalColorStatus").set("진단중");
  if (stream) stream.getTracks().forEach(t => t.stop());

  try {
    const faceResp = await fetch("/api/vision", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ base64: base64, feature: "FACE_DETECTION" })
    });
    const faceData = await faceResp.json();
    const face = faceData.responses[0].faceAnnotations && faceData.responses[0].faceAnnotations[0];

    if (!face) {
      showOnly("retryCard");
      document.getElementById("retryReason").textContent = "얼굴을 인식하지 못했습니다. 정면을 바라보고 다시 촬영해주세요.";
      db.ref("teams/" + teamId + "/personalColorStatus").set("대기중");
      return;
    }

    const landmarks = face.landmarks;
    const width = canvas.width, height = canvas.height;
    const imgData = ctx.getImageData(0, 0, width, height).data;

    // 얼굴 크기(눈 사이 거리 기준)로 샘플링 반경을 얼굴 크기에 비례하게 설정
    const leftEyeCenter = findLandmark(landmarks, "LEFT_EYE");
    const rightEyeCenter = findLandmark(landmarks, "RIGHT_EYE");
    let eyeDist = 60;
    if (leftEyeCenter && rightEyeCenter) {
      eyeDist = Math.hypot(leftEyeCenter.x - rightEyeCenter.x, leftEyeCenter.y - rightEyeCenter.y);
    }
    const patchRadius = Math.max(4, eyeDist * 0.12);

    // 피부 샘플: 양쪽 볼 + 이마
    const leftCheek = findLandmark(landmarks, "LEFT_CHEEK_CENTER");
    const rightCheek = findLandmark(landmarks, "RIGHT_CHEEK_CENTER");
    const forehead = findLandmark(landmarks, "FOREHEAD_GLABELLA");

    const skinPatches = [leftCheek, rightCheek, forehead]
      .filter(Boolean)
      .map(p => samplePatch(imgData, width, height, p.x, p.y, patchRadius));
    const skinColor = averageColors(skinPatches);

    if (!skinColor) {
      showOnly("retryCard");
      document.getElementById("retryReason").textContent = "피부색을 정확히 읽지 못했습니다. 조명이 밝은 곳에서 다시 촬영해주세요.";
      db.ref("teams/" + teamId + "/personalColorStatus").set("대기중");
      return;
    }

    // 화이트밸런스 기준: 1순위 흰 종이(넓고 안정적), 2순위 눈의 흰자(공막)
    let wbColor = samplePaperReference(imgData, width, height);
    let wbTarget = 225; // 흰 종이 기준 목표값
    let wbSource = "paper";

    if (!wbColor) {
      const leftPupil = findLandmark(landmarks, "LEFT_EYE_PUPIL");
      const leftCorner = findLandmark(landmarks, "LEFT_EYE_LEFT_CORNER");
      const rightPupil = findLandmark(landmarks, "RIGHT_EYE_PUPIL");
      const rightCorner = findLandmark(landmarks, "RIGHT_EYE_RIGHT_CORNER");

      const scleraPoints = [];
      if (leftPupil && leftCorner) scleraPoints.push({ x: (leftPupil.x + leftCorner.x) / 2, y: (leftPupil.y + leftCorner.y) / 2 });
      if (rightPupil && rightCorner) scleraPoints.push({ x: (rightPupil.x + rightCorner.x) / 2, y: (rightPupil.y + rightCorner.y) / 2 });

      wbColor = averageColors(scleraPoints.map(p => samplePatch(imgData, width, height, p.x, p.y, patchRadius * 0.6)));
      wbTarget = 210; // 공막 기준 목표값 (종이보다 약간 낮게)
      wbSource = "sclera";
    }

    let correctedSkin = skinColor;
    if (wbColor) {
      const clamp = v => Math.max(0.75, Math.min(1.35, v));
      const fr = clamp(wbTarget / wbColor.r);
      const fg = clamp(wbTarget / wbColor.g);
      const fb = clamp(wbTarget / wbColor.b);
      correctedSkin = {
        r: Math.min(255, skinColor.r * fr),
        g: Math.min(255, skinColor.g * fg),
        b: Math.min(255, skinColor.b * fb)
      };
    }

    // 머리카락 샘플 (이마 위쪽, 얼굴 크기에 비례한 위치) - 밝기 톤 보조 지표
    let hairLab = null;
    if (forehead) {
      const hairPoint = { x: forehead.x, y: forehead.y - eyeDist * 1.3 };
      const hairPatch = samplePatch(imgData, width, height, hairPoint.x, hairPoint.y, patchRadius);
      if (hairPatch) hairLab = rgbToLab(hairPatch.r, hairPatch.g, hairPatch.b);
    }

    const skinLab = rgbToLab(correctedSkin.r, correctedSkin.g, correctedSkin.b);
    const depthScore = hairLab ? (skinLab.L * 0.7 + hairLab.L * 0.3) : skinLab.L;

    const type = classify(skinLab, depthScore);
    const info = TYPES[type];

    showOnly("resultCard");
    document.getElementById("resultTitle").textContent = info.title;
    document.getElementById("resultDesc").textContent = info.desc;
    document.getElementById("palette").innerHTML = info.colors.map(c =>
      `<span style="display:inline-block;width:40px;height:40px;border-radius:8px;background:${c};margin-right:8px;border:1px solid #ccc;"></span>`
    ).join("");

    db.ref("teams/" + teamId + "/personalColorStatus").set("완료: " + info.title);
  } catch (e) {
    showOnly("retryCard");
    document.getElementById("retryReason").textContent = "분석 중 오류가 발생했습니다: " + e.message;
    db.ref("teams/" + teamId + "/personalColorStatus").set("대기중");
  }
};

document.getElementById("retryBtn").onclick = () => location.reload();
document.getElementById("retryFromErrorBtn").onclick = () => location.reload();
</script>
</body>
</html>
