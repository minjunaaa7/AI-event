<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI와 오목</title>
<link rel="stylesheet" href="style.css">
<style>
  #board {
    display: grid;
    grid-template-columns: repeat(15, 1fr);
    aspect-ratio: 1;
    background: #dcb35c;
    border: 2px solid #7a5c2e;
    border-radius: 6px;
    overflow: hidden;
  }
  .cell {
    position: relative;
    border: 1px solid #b3894a;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .stone {
    width: 78%;
    height: 78%;
    border-radius: 50%;
  }
  .stone.black { background: #1c1c1e; }
  .stone.white { background: #fdfdfd; border: 1px solid #999; }
</style>
</head>
<body>
<div class="wrap">
  <h1>AI와 오목</h1>

  <div class="card" id="chooseAiCard">
    <h2>상대 AI 선택</h2>
    <div class="grid-2">
      <button id="pickHobby">취미가 오목 (약함)</button>
      <button id="pickVeteran">오목 베테랑 (강함)</button>
    </div>
  </div>

  <div class="card" id="diceCard" style="display:none;">
    <h2>돌 색 정하기</h2>
    <p class="status-line">주사위를 굴려 더 높은 사람이 원하는 돌을 선택합니다.</p>
    <button class="full" id="rollBtn">주사위 굴리기</button>
    <p class="status-line" id="diceResult"></p>
    <div class="grid-2" id="colorPick" style="display:none; margin-top:10px;">
      <button id="pickBlack">흑돌 선택 (선공)</button>
      <button id="pickWhite">백돌 선택 (후공)</button>
    </div>
  </div>

  <div class="card" id="gameCard" style="display:none;">
    <p class="status-line" id="turnStatus"></p>
    <div id="board"></div>
  </div>

  <div class="card" id="resultCard" style="display:none;">
    <h2 id="resultText"></h2>
    <button class="full secondary" id="playAgainBtn">다시 하기</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="js/firebase-init.js?v=3"></script>
<script src="js/db-helper.js?v=3"></script>
<script>
const teamId = getTeamId();
const SIZE = 15;
let board, aiLevel, humanColor, aiColor, turn, gameOver;

function showOnly(id) {
  ["chooseAiCard","diceCard","gameCard","resultCard"].forEach(c =>
    document.getElementById(c).style.display = (c === id) ? "block" : "none");
}

document.getElementById("pickHobby").onclick = () => { aiLevel = "hobby"; showOnly("diceCard"); };
document.getElementById("pickVeteran").onclick = () => { aiLevel = "veteran"; showOnly("diceCard"); };

document.getElementById("rollBtn").onclick = () => {
  const human = Math.ceil(Math.random() * 6);
  const ai = Math.ceil(Math.random() * 6);
  if (human === ai) {
    document.getElementById("diceResult").textContent = `나: ${human} / AI: ${ai} - 동점! 다시 굴리세요.`;
    return;
  }
  if (human > ai) {
    document.getElementById("diceResult").textContent = `나: ${human} / AI: ${ai} - 승리! 원하는 돌을 선택하세요.`;
    document.getElementById("colorPick").style.display = "grid";
  } else {
    // AI 승리: 흑돌 70%, 백돌 30%
    const aiWantsBlack = Math.random() < 0.7;
    aiColor = aiWantsBlack ? "black" : "white";
    humanColor = aiWantsBlack ? "white" : "black";
    document.getElementById("diceResult").textContent =
      `나: ${human} / AI: ${ai} - AI 승리. AI가 ${aiWantsBlack ? "흑돌" : "백돌"}을 선택했습니다.`;
    setTimeout(startGame, 1200);
  }
};

document.getElementById("pickBlack").onclick = () => { humanColor = "black"; aiColor = "white"; startGame(); };
document.getElementById("pickWhite").onclick = () => { humanColor = "white"; aiColor = "black"; startGame(); };

function startGame() {
  board = Array.from({length: SIZE}, () => Array(SIZE).fill(null));
  turn = "black"; // 흑돌 선공
  gameOver = false;
  showOnly("gameCard");
  renderBoard();
  updateTurnStatus();
  if (turn === aiColor) setTimeout(aiMove, 500);
}

function updateTurnStatus() {
  const who = turn === humanColor ? "내 차례" : "AI 차례";
  document.getElementById("turnStatus").textContent = `${who} (${turn === "black" ? "흑돌" : "백돌"})`;
}

function renderBoard() {
  const el = document.getElementById("board");
  el.innerHTML = "";
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      if (board[r][c]) {
        const stone = document.createElement("div");
        stone.className = "stone " + board[r][c];
        cell.appendChild(stone);
      } else {
        cell.onclick = () => humanPlay(r, c);
      }
      el.appendChild(cell);
    }
  }
}

function humanPlay(r, c) {
  if (gameOver || turn !== humanColor || board[r][c]) return;
  place(r, c, humanColor);
}

function place(r, c, color) {
  board[r][c] = color;
  renderBoard();
  if (checkWin(r, c, color)) {
    endGame(color === humanColor ? "win" : "lose");
    return;
  }
  if (isBoardFull()) { endGame("draw"); return; }
  turn = (turn === "black") ? "white" : "black";
  updateTurnStatus();
  if (!gameOver && turn === aiColor) setTimeout(aiMove, 500);
}

function isBoardFull() {
  return board.every(row => row.every(v => v !== null));
}

function checkWin(r, c, color) {
  const dirs = [[1,0],[0,1],[1,1],[1,-1]];
  for (const [dx, dy] of dirs) {
    let count = 1;
    for (let s = 1; s < 5; s++) {
      const nr = r + dx*s, nc = c + dy*s;
      if (nr<0||nr>=SIZE||nc<0||nc>=SIZE||board[nr][nc]!==color) break;
      count++;
    }
    for (let s = 1; s < 5; s++) {
      const nr = r - dx*s, nc = c - dy*s;
      if (nr<0||nr>=SIZE||nc<0||nc>=SIZE||board[nr][nc]!==color) break;
      count++;
    }
    if (count >= 5) return true;
  }
  return false;
}

async function endGame(result) {
  gameOver = true;
  let text, points, opponentLabel = aiLevel === "hobby" ? "취미가 오목" : "오목 베테랑";
  if (result === "win") { text = "승리했습니다!"; points = aiLevel === "hobby" ? 20 : 50; }
  else if (result === "lose") { text = "패배했습니다."; points = 5; }
  else { text = "무승부입니다."; points = 5; }

  document.getElementById("resultText").textContent = text;
  showOnly("resultCard");

  await addScore(teamId, points);
  const histRef = db.ref("teams/" + teamId + "/omok/history").push();
  await histRef.set({ opponent: opponentLabel, result: text, points });
}

document.getElementById("playAgainBtn").onclick = () => showOnly("chooseAiCard");

// ===== AI 로직 =====
function candidateMoves() {
  const moves = [];
  const seen = new Set();
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (!board[r][c]) continue;
      for (let dr = -2; dr <= 2; dr++) {
        for (let dc = -2; dc <= 2; dc++) {
          const nr = r+dr, nc = c+dc;
          if (nr<0||nr>=SIZE||nc<0||nc>=SIZE||board[nr][nc]) continue;
          const key = nr+"_"+nc;
          if (!seen.has(key)) { seen.add(key); moves.push([nr,nc]); }
        }
      }
    }
  }
  if (moves.length === 0) return [[Math.floor(SIZE/2), Math.floor(SIZE/2)]];
  return moves;
}

function lineScore(r, c, color) {
  const dirs = [[1,0],[0,1],[1,1],[1,-1]];
  let total = 0;
  for (const [dx,dy] of dirs) {
    let count = 1, openEnds = 0;
    let nr = r+dx, nc = c+dy;
    while (nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&board[nr][nc]===color) { count++; nr+=dx; nc+=dy; }
    if (nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&!board[nr][nc]) openEnds++;
    nr = r-dx; nc = c-dy;
    while (nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&board[nr][nc]===color) { count++; nr-=dx; nc-=dy; }
    if (nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&!board[nr][nc]) openEnds++;

    if (count >= 5) total += 100000;
    else if (count === 4) total += openEnds >= 1 ? 10000 : 1000;
    else if (count === 3) total += openEnds === 2 ? 2000 : (openEnds === 1 ? 400 : 0);
    else if (count === 2) total += openEnds === 2 ? 100 : 20;
  }
  return total;
}

function bestMoveFor(color, oppColor) {
  const moves = candidateMoves();
  let best = moves[0], bestScore = -Infinity;
  for (const [r,c] of moves) {
    const offense = lineScore(r, c, color);
    const defense = lineScore(r, c, oppColor);
    const score = offense * 1.05 + defense;
    if (score > bestScore) { bestScore = score; best = [r,c]; }
  }
  return best;
}

function aiMove() {
  if (gameOver) return;
  let move;
  if (aiLevel === "veteran") {
    move = bestMoveFor(aiColor, humanColor);
  } else {
    // 취미가 오목: 40% 랜덤(단, 후보 지점 중에서만), 60% 계산
    if (Math.random() < 0.4) {
      const moves = candidateMoves();
      move = moves[Math.floor(Math.random() * moves.length)];
    } else {
      move = bestMoveFor(aiColor, humanColor);
    }
  }
  place(move[0], move[1], aiColor);
}
</script>
</body>
</html>
